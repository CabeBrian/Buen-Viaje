<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buen Viaje Amor</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Playfair+Display&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    overflow-x: hidden;
}

/* Fondo FIX para mobile */
.fondo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background-image: url('https://images.unsplash.com/photo-1470509037663-253afd7f0f51');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: -2;
}

/* Oscurecer un poco */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.35);
    z-index: -1;
}

/* Contenedor */
.carta-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* Carta */
.carta {
    width: 100%;
    max-width: 700px;
    padding: 25px;

    background: linear-gradient(to bottom, #f5e6c8, #e4cfa3);
    border-radius: 10px;
    border: 2px solid #c2a878;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);

    animation: abrirCarta 1.5s ease;
}

/* Animación más suave para celular */
@keyframes abrirCarta {
    from {
        transform: scale(0.9);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

h1 {
    text-align: center;
    font-family: 'Dancing Script', cursive;
    font-size: 32px;
}

/* Nombre */
.nombre {
    text-align: center;
    font-size: 36px;
    font-family: 'Dancing Script', cursive;
    opacity: 0;
    animation: aparecerNombre 2s ease forwards;
    animation-delay: 1s;
}

@keyframes aparecerNombre {
    from {
        opacity: 0;
        letter-spacing: 10px;
    }
    to {
        opacity: 1;
        letter-spacing: 2px;
    }
}

p {
    font-size: 16px;
    line-height: 1.6;
    text-align: justify;
    white-space: pre-line;
}

/* Botón */
.boton {
    display: block;
    margin: 20px auto;
    padding: 10px 20px;
    font-size: 16px;
    background: #d4a017;
    color: white;
    border: none;
    border-radius: 20px;
}

/* Mensaje */
.mensaje {
    text-align: center;
    font-size: 24px;
    font-family: 'Dancing Script', cursive;
    display: none;
}

/* Botón música */
.musica-btn {
    position: fixed;
    bottom: 15px;
    right: 15px;
    font-size: 14px;
    padding: 8px 12px;
    background: black;
    color: white;
    border: none;
    border-radius: 15px;
}
</style>
</head>

<body>

<div class="fondo"></div>
<div class="overlay"></div>

<audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<button class="musica-btn" onclick="activarMusica()">🎵 Música</button>

<div class="carta-container">
    <div class="carta">

        <div class="nombre">Henriette 💛</div>

        <h1>Buen viaje amor</h1>

        <p>
(Pegá acá tu texto completo)
        </p>

        <button class="boton" onclick="mostrarMensaje()">Te amo 💌</button>

        <div class="mensaje" id="mensajeFinal">
            Siempre voy a estar para vos 🌻💛
        </div>

    </div>
</div>

<script>
<script>
document.body.addEventListener("click", () => {
    let musica = document.getElementById("musica");
    musica.volume = 0.4;
    musica.play();
}, { once: true });
</script>

</body>
</html>
